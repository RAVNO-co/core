name: Linting and tests for python projects

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:  # Keep in sync with dockerfile
  PYTHON_VERSION: ">=3.14"
  POETRY_VERSION: "2.4.1"

jobs:
  ruff:
    name: Ruff linting
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: "pipx install poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
      - run: "poetry install"
      - run: "poetry run ruff check"
  mypy:
    name: Mypy typechecking
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: "pipx install poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
      - run: "poetry install"
      - run: "poetry run mypy src tests"
  pytest:
    name: Tests and coverage reporting
    needs: [ ruff, mypy ]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: "pipx install poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - uses: actions/cache@v6
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
      - run: "poetry install"
      - run: "poetry run pytest --cov=src --cov-report=xml"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
