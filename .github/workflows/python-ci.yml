name: Linting and tests for python projects

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  code-quality: write

env: # Keep in sync with dockerfile
  PYTHON_VERSION: ">=3.14"
  POETRY_VERSION: "2.4"

jobs:
  ruff:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: "pipx install poetry"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
      - run: "poetry install"
      - run: "poetry run ruff check"
  mypy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: "pipx install poetry"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
      - run: "poetry install"
      - run: "poetry run mypy src tests"
  pytest:
    needs: [ ruff, mypy ]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: "pipx install poetry"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - uses: actions/cache@v6
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
      - run: "poetry install"
      - run: "poetry run pytest --cov=src --cov-report=xml"
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: pytest
