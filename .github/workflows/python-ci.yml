name: Linting and tests for python projects

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions: read-all

env: # Keep in sync with dockerfile
  PYTHON_VERSION: ">=3.14"
  POETRY_VERSION: "2.4"

jobs:
  ruff:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: "pipx install poetry"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "poetry"
      - run: "poetry run ruff check"
